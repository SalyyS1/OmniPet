<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 350" width="668" height="350" role="img" aria-label="A placed egg">
  <rect width="668" height="350" fill="#f3f0e7"/>
  <text x="24" y="34" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#9c4310" letter-spacing="1.6">A PLACED EGG</text>
  <line x1="24" y1="46" x2="644" y2="46" stroke="#102a2b" stroke-opacity="0.32"/>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#102a2b" fill-opacity="0.55"/>
    </marker>
  </defs>
  <rect x="24" y="90" width="176" height="62" rx="4" fill="#e7e0d0" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="112" y="117" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Place egg</text>
  <text x="112" y="135" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">beside heat</text>
  <rect x="246" y="90" width="176" height="62" rx="4" fill="#e7e0d0" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="334" y="117" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Block record</text>
  <text x="334" y="135" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">data/placed-eggs/</text>
  <rect x="468" y="90" width="176" height="62" rx="4" fill="#e7e0d0" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="556" y="117" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Hologram</text>
  <text x="556" y="135" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">derived, never saved</text>
  <rect x="246" y="188" width="176" height="62" rx="4" fill="#e7e0d0" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="334" y="215" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Break block</text>
  <text x="334" y="233" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">record deleted first</text>
  <rect x="468" y="188" width="176" height="62" rx="4" fill="#85c8b2" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="556" y="215" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Egg returned</text>
  <text x="556" y="233" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">same egg, same id</text>
  <line x1="204" y1="121" x2="242" y2="121" stroke="#102a2b" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <line x1="426" y1="121" x2="464" y2="121" stroke="#102a2b" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <line x1="334" y1="152" x2="334" y2="184" stroke="#102a2b" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <text x="334" y="161" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#2d4a49">break</text>
  <line x1="426" y1="219" x2="464" y2="219" stroke="#102a2b" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <text x="24" y="284" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">The record is the single owner. Breaking deletes it before the item exists again, so a</text>
  <text x="24" y="302" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">break-and-replace cycle cannot produce a second egg.</text>
  <text x="24" y="326" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">Holograms are rebuilt from records on chunk load, so a crash leaves nothing to clean up.</text>
</svg>
