<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 228" width="950" height="228" role="img" aria-label="Hatching an egg">
  <rect width="950" height="228" fill="#f3f0e7"/>
  <text x="24" y="34" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#e67532" letter-spacing="1.6">HATCHING AN EGG</text>
  <line x1="24" y1="46" x2="926" y2="46" stroke="#102a2b" stroke-opacity="0.22"/>
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#102a2b" fill-opacity="0.55"/>
    </marker>
  </defs>
  <rect x="24" y="90" width="150" height="62" rx="4" fill="#e7e0d0" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="99" y="117" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Hold egg</text>
  <text x="99" y="135" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">/pet hatch main</text>
  <rect x="212" y="90" width="150" height="62" rx="4" fill="#e7e0d0" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="287" y="117" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Escrow PREPARED</text>
  <text x="287" y="135" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">payment recorded</text>
  <line x1="178" y1="121" x2="208" y2="121" stroke="#102a2b" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <rect x="400" y="90" width="150" height="62" rx="4" fill="#e7e0d0" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="475" y="117" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Roll outcome</text>
  <text x="475" y="135" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">rarity + stats</text>
  <line x1="366" y1="121" x2="396" y2="121" stroke="#102a2b" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <rect x="588" y="90" width="150" height="62" rx="4" fill="#e7e0d0" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="663" y="117" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">Remove egg</text>
  <text x="663" y="135" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">only if roll ok</text>
  <line x1="554" y1="121" x2="584" y2="121" stroke="#102a2b" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <rect x="776" y="90" width="150" height="62" rx="4" fill="#85c8b2" stroke="#102a2b" stroke-opacity="0.35"/>
  <text x="851" y="117" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" font-weight="600" fill="#102a2b">COMMITTED</text>
  <text x="851" y="135" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">countdown starts</text>
  <line x1="742" y1="121" x2="772" y2="121" stroke="#102a2b" stroke-opacity="0.55" stroke-width="1.6" marker-end="url(#arrowhead)"/>
  <text x="24" y="186" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">The roll runs before the egg leaves your inventory, so a failed roll never costs you the egg.</text>
  <text x="24" y="204" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="11" fill="#2d4a49">The countdown and the claim button stay locked until escrow reads COMMITTED.</text>
</svg>
