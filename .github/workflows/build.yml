name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OmniPet
          path: build/release/*.jar
          if-no-files-found: error

  compatibility:
    name: Paper ${{ matrix.paper }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - paper: 1.21-R0.1-SNAPSHOT
            java: 21
          - paper: 1.21.11-R0.1-SNAPSHOT
            java: 21
          - paper: 26.1.1.build.29-alpha
            java: 25
          - paper: 26.1.2.build.74-stable
            java: 25
          - paper: 26.2.build.87-stable
            java: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25 compatibility toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Remember Java 25 toolchain
        run: echo "OMNIPET_JAVA_25=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile compatibility target
        run: |
          chmod +x gradlew
          ./gradlew compileCompatibilityJava \
            -PcompatibilityPaperApiVersion=${{ matrix.paper }} \
            -PcompatibilityJavaVersion=${{ matrix.java }} \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME,$OMNIPET_JAVA_25" \
            --no-daemon
