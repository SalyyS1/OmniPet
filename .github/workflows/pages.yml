name: Deploy OmniPet docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/build-wiki-diagrams.mjs'
      - 'tools/verify-wiki-render.mjs'
      - 'tools/verify-wiki-browser.mjs'
      - 'tools/build-wiki-art.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Diagrams are generated rather than committed as binaries, so they cannot drift from the
      # generator. The committed SVGs are also valid, so a failure here does not break the deploy.
      - name: Generate diagrams
        run: node tools/build-wiki-diagrams.mjs

      # Fails the deploy on a page that does not render or a translation that is missing, rather than
      # publishing it and finding out from a reader.
      - name: Verify the wiki renders
        run: node tools/verify-wiki-render.mjs

      # The checks a layout engine has to answer: measured line length, deep links surviving a reload,
      # the contents list still being reachable at 375px. Gating too, because these were real defects
      # rather than preferences, and the stub DOM above cannot see any of them.
      - name: Verify the wiki in a browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8899 --directory docs &
          for _ in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8899/wiki.html && break
            sleep 0.5
          done
          node tools/verify-wiki-browser.mjs http://localhost:8899

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4

