# ASCII-safe starter example. Keep the filename to preserve the pet ID `nahara`.
general:
  name: "<light_purple>Nahara"
  texture: "https://textures.minecraft.net/texture/5d194093f95772f3ac477d6de5d7abc187b34ff2827743ca57e56cc1ac20ba9f"
  description:
    - "<!i><gray>A curious arcane companion."
    - "<!i><dark_gray>Interact for a small trick; punch the display for training."

display:
  texture: "https://textures.minecraft.net/texture/5d194093f95772f3ac477d6de5d7abc187b34ff2827743ca57e56cc1ac20ba9f"

hatching:
  defaultRarity: 2

leveling:
  maxLevel: 20
  maxExp: 100 + math.pow(2, leveling.level)
  maxEvolution: 5

stamina:
  maxStamina: 100 + leveling.level * 8 + hatching.rarity * 5

trigger:
  - type: interval
    cooldown: 200 - leveling.evolution * 10
    precondition: stamina.value >= 4
    lore:
      - ""
      - "<!i><gray>Arcane Spark <trigger_progressbar:18:'|'> <yellow><trigger_cooldown>"
      - "<!i><dark_gray>Creates glowstone dust while summoned."
    script:
      - stamina.take(4)
      - player.giveItem(items.GLOWSTONE_DUST)

  - type: interact
    cooldown: 1200
    lore:
      - "<!i><gray>Prism Trick <trigger_progressbar:18:'|'> <yellow><trigger_cooldown> <bold>RIGHT"
    script:
      - player.giveItem(items.AMETHYST_SHARD
          .withAmount(1 + leveling.evolution)
          .withName("<aqua>Arcane Prism")
          .withLore("<!i><gray>A harmless souvenir from Nahara."))

  - type: punch
    cooldown: 1200
    lore:
      - "<!i><gray>Training Pulse <trigger_progressbar:18:'|'> <yellow><trigger_cooldown> <bold>LEFT"
    script:
      - leveling.addExp(50)

  - type: takingDamage
    script:
      - print("Owner took " + trigger.realDamage + " final damage")

  - type: walk
    script:
      - if: stamina.tryTaking(trigger.walkDistance * 0.1)
        onTrue: leveling.addExp(trigger.walkDistance * (leveling.evolution + 1))

  - type: release
    script:
      - player.giveItem(items.FEATHER.withAmount(3))
      - if: leveling.evolution > 0
        onTrue: player.giveItem(items.AMETHYST_SHARD.withAmount(1))

