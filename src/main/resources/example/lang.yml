# Adventure MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Preview strings at https://webui.advntr.dev/

hud:
  hatchingBossbar: "<gray>Hatching <egg_name> <dark_gray>- <yellow><egg_hatch_duration>"

messages:
  summon:
    - "<dark_gray>[<green>OmniPet</green>]</dark_gray> Summoned <pet_name>."

  recall:
    - "<dark_gray>[<green>OmniPet</green>]</dark_gray> Recalled <pet_name>."

  summonAndRecall:
    - "<dark_gray>[<green>OmniPet</green>]</dark_gray> Summoned <summoned_pet> and recalled <recalled_pet>."

  storageFull:
    - "<dark_gray>[<green>OmniPet</green>]</dark_gray> <red>Your pet storage is full.</red>"

  beginHatching:
    - "<dark_gray>[<green>OmniPet</green>]</dark_gray> Started hatching <egg_name> for <yellow><egg_hatch_duration></yellow>."

  hatched:
    - "<dark_gray>[<green>OmniPet</green>]</dark_gray> Hatched <pet_name> from <egg_name>."

  released:
    - "<dark_gray>[<green>OmniPet</green>]</dark_gray> Released <pet_name> into the wild."

  leveling:
    levelUp:
      - "<dark_gray>[<green>OmniPet</green>]</dark_gray> <pet_name> reached level <aqua><next_level></aqua>."

    evolve:
      - "<dark_gray>[<green>OmniPet</green>]</dark_gray> <pet_name> evolved to rank <light_purple><next_evolution></light_purple>."

  stamina:
    outOfStamina:
      - "<dark_gray>[<green>OmniPet</green>]</dark_gray> <pet_name> is out of stamina."

    fullStamina:
      - "<dark_gray>[<green>OmniPet</green>]</dark_gray> <pet_name> is fully rested."

components:
  leveling:
    - "<!i><gray>Level <aqua><level></aqua>/<max_level> <level_progressbar:18:'|'> <dark_gray>(<yellow><exp></yellow>/<max_exp>)"

  stamina:
    - "<!i><gray>Stamina <stamina_progressbar:18:'|'> <dark_gray>(<yellow><stamina></yellow>/<max_stamina>)"

