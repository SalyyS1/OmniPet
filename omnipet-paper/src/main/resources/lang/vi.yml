# OmniPet — Tiếng Việt
#
# Bản dịch đầy đủ của văn bản người chơi nhìn thấy.
# Định dạng MiniMessage: https://docs.advntr.dev/minimessage/format.html
#
# File này là LỚP NỀN. messages.yml của bạn luôn được ưu tiên hơn: một khoá có trong
# messages.yml sẽ đè lên bản dịch này, còn khoá thiếu ở đây sẽ lùi về bản tiếng Anh gốc.
# Nhờ vậy một bản dịch làm dở vẫn chạy được.
#
# Các thẻ như <pet>, <amount>, <detail> được điền nguyên văn và không bao giờ phân tích lại,
# nên một con thú cưng tên "<red>" không thể đổi màu màn hình người khác.
#
# Chọn ngôn ngữ bằng gui.locale trong config.yml. Tải lại bằng /pet admin reload.

