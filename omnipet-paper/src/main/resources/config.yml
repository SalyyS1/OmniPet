# OmniPet operational storage limits. Changes are staged and validated before activation.
storage:
  vault:
    # Minimum effective owned-pet capacity for every player.
    baseCapacity: 30
    # Upper bound for configured and legacy permission-derived capacity.
    maxCapacity: 200
    legacyPermission:
      # Reads consecutive petstorage.slot.N grants live; observations are never persisted.
      enabled: true
      template: "petstorage.slot.%s"
      # Stops at the first missing node and never checks beyond this safe bound.
      maxScan: 200
  activeSlots:
    # When false, core limits active intent to one pet without deleting stored pets.
    multiPetEnabled: true
    # Starting entitlement used when new player state is initialized.
    base: 1
    # Global clamp for purchased active-slot entitlements.
    max: 5
    entitlement:
      # OMNIPET is authoritative by default. LUCKPERMS and HYBRID remain explicit opt-ins.
      mode: OMNIPET
      precedence: OMNIPET_AUTHORITATIVE
      luckPermsPermissionTemplate: "omnipet.slot.unlocked.%s"
    unlocks:
      "2":
        # Empty means every player may buy this slot. A non-empty node is eligibility-only.
        permission: ""
        # Multiple available costs are shown as separate choices; OmniPet never auto-selects.
        costs: { VAULT: 25000, PLAYER_POINTS: 50 }
      "3":
        permission: ""
        costs: { VAULT: 75000, PLAYER_POINTS: 125 }
      "4":
        permission: "omnipet.slot.purchase.4"
        costs: { VAULT: 175000, PLAYER_POINTS: 250 }
      "5":
        permission: "omnipet.slot.purchase.5"
        costs: { VAULT: 350000, PLAYER_POINTS: 500 }
