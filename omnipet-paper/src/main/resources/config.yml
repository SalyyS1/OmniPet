# OmniPet operational storage limits. Changes are staged and validated before activation.
storage:
  vault:
    # Minimum effective owned-pet capacity for every player.
    baseCapacity: 30
    # Upper bound for configured and legacy permission-derived capacity.
    maxCapacity: 200
    legacyPermission:
      # Reads consecutive petstorage.slot.N grants live; observations are never persisted.
      enabled: true
      template: "petstorage.slot.%s"
      # Stops at the first missing node and never checks beyond this safe bound.
      maxScan: 200
  activeSlots:
    # When false, core limits active intent to one pet without deleting stored pets.
    multiPetEnabled: true
    # Starting entitlement used when new player state is initialized.
    base: 1
    # Global clamp for purchased active-slot entitlements.
    max: 5
    entitlement:
      # OMNIPET is authoritative by default. LUCKPERMS and HYBRID remain explicit opt-ins.
      mode: OMNIPET
      precedence: OMNIPET_AUTHORITATIVE
      luckPermsPermissionTemplate: "omnipet.slot.unlocked.%s"
    unlocks:
      "2":
        # Empty means every player may buy this slot. A non-empty node is eligibility-only.
        permission: ""
        # Multiple available costs are shown as separate choices; OmniPet never auto-selects.
        costs: { VAULT: 25000, PLAYER_POINTS: 50 }
      "3":
        permission: ""
        costs: { VAULT: 75000, PLAYER_POINTS: 125 }
      "4":
        permission: "omnipet.slot.purchase.4"
        costs: { VAULT: 175000, PLAYER_POINTS: 250 }
      "5":
        permission: "omnipet.slot.purchase.5"
        costs: { VAULT: 350000, PLAYER_POINTS: 500 }

# One bounded coordinator updates every active pet. Scheduler changes require a restart.
runtime:
  initialDelayTicks: 1
  periodTicks: 1
  maximumOwnersPerTick: 64
  maximumPetsPerOwner: 10

# Global cultivation fallback. A validated pet definition may override the EXP formula.
progression:
  maxLevel: 100
  maxStamina: 100.0
  staminaRegenPerSecond: 1.0
  defaultExperienceFormula: "100 + level * 25 + evolution * 100"
  formulaSamples: { level: 1.0, rarity: 1.0, quality: 0.5, evolution: 0.0 }
  overflowPolicy: CARRY

# Standalone material defaults. MMOItems identities can be added through the item adapter.
items:
  experienceCandy:
    material: EXPERIENCE_BOTTLE
    experience: 100.0
  breakthroughStone:
    material: NETHER_STAR
    requiredLevel: 10
    requiredEvolution: 0

# Compatibility targets used by linkage-safe adapters. These values are documentation only.
integrations:
  mythicLib: "1.7.1-SNAPSHOT build 106"
  mythicMobs: "5.9.0"
  modelEngine: "R4.0.9"

# Menu behaviour and player feedback. The whole section is optional: delete it and OmniPet behaves
# exactly as it did before this section existed. Unlike `storage:`, a mistake here is never fatal —
# an unknown key is ignored with a warning and a bad value falls back to its default, because a typo
# in a page size must not stop players using their pets.
gui:
  feedback:
    # One master switch. `false` silences every sound and action bar plugin-wide, for servers with
    # their own sound design and for players using a screen reader. Reloads live.
    enabled: true
    # Floor between two sounds from the same player, in milliseconds. Stops a fast-clicking player
    # becoming an audible nuisance. Reloads live.
    minIntervalMillis: 150
    # Action-bar text alongside the sound. Chat messages are unaffected either way. Reloads live.
    actionBar: true
    # One cue per outcome, not per event, so adding a feature never requires new config here.
    # An unknown sound name warns at load and silences that one category. Reloads live.
    success:  { sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 0.6, pitch: 1.2 }
    failure:  { sound: "BLOCK_NOTE_BLOCK_BASS",        volume: 0.6, pitch: 0.8 }
    blocked:  { sound: "BLOCK_CHEST_LOCKED",           volume: 0.6, pitch: 1.0 }
    progress: { sound: "UI_BUTTON_CLICK",              volume: 0.4, pitch: 1.0 }
  vault:
    # RESTART ONLY - /pet admin reload will not apply a change here.
    # Capped at 45: the 54-slot layout reserves the bottom row for paging and controls.
    petsPerPage: 45
  help:
    # RESTART ONLY - /pet admin reload will not apply a change here. Capped at 20.
    linesPerPage: 8
  studio:
    # RESTART ONLY - /pet admin reload will not apply a change here.
    # How long a Studio chat prompt waits for a reply before expiring.
    promptTimeoutSeconds: 120
    # Saving a pet in the Studio also writes eggs/<definitionId>_egg.yml, so the new pet can be
    # obtained with /pet admin egg give. An existing catalog entry is never overwritten. Set false
    # if your egg catalog is hand-designed and you do not want the Studio adding files. Reloads live.
    autoCreateEgg: true
