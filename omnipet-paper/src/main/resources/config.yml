# ==============================================================================================
#  OmniPet
# ==============================================================================================
#  Player-facing text is NOT here - it lives in messages.yml, written beside this file on first
#  run. Pets live in pets/*.yml (edit them with /pet admin browse, not by hand) and eggs in
#  eggs/*.yml. Full reference: docs/configuration.md
#
#  Reloading with /pet admin reload
#    Most values below apply immediately. The ones that do not are marked RESTART ONLY, and a
#    reload tells you when it ignored something - it never fails silently.
#
#  Two kinds of section
#    storage:  strict. An unknown key or a bad value stops startup, because a mistake in a
#              capacity or a price is a mistake about someone's pets or money.
#    others:   lenient. A bad value warns and falls back to its default, because a typo in a
#              page size must never stop players using their pets.
# ==============================================================================================


# ----------------------------------------------------------------------------------------------
#  STORAGE - how many pets a player may own, and how many may be out at once
# ----------------------------------------------------------------------------------------------
#  STRICT SECTION. Validated before it is activated; a bad value here stops startup by design.
#  Lowering a limit never deletes a pet. Pets above the new limit become read-only until
#  capacity is restored.
# ----------------------------------------------------------------------------------------------
storage:

  # How many pets a player may KEEP. This is the vault.
  vault:
    # Every player gets at least this much room, no permission needed.
    baseCapacity: 30
    # Hard ceiling. Nothing - config, permission, or legacy grant - raises capacity past this.
    maxCapacity: 200

    # Honours capacity from a previous pet plugin so migrated players keep the room they paid for.
    legacyPermission:
      enabled: true
      template: "petstorage.slot.%s"
      # Counts consecutive grants (slot.1, slot.2, ...) and stops at the first one missing, so a
      # gap in the grants ends the scan. Read live and never written into player data.
      maxScan: 200

  # How many of those pets may be ACTIVE - rendered in the world - at the same time.
  activeSlots:
    # false limits every player to one active pet. Stored pets are untouched and nothing is
    # deleted; extra active intent is simply clamped until you turn this back on.
    multiPetEnabled: true
    # Active slots a brand-new player starts with.
    base: 1
    # Hard ceiling on purchased slots. Also bounds the LuckPerms template check below.
    max: 5

    # Who decides how many active slots a player has.
    entitlement:
      #   OMNIPET   - OmniPet's own records decide. Default; needs no other plugin.
      #   LUCKPERMS - permission nodes decide.
      #   HYBRID    - both, resolved by `precedence` below.
      mode: OMNIPET
      precedence: OMNIPET_AUTHORITATIVE
      # Only consulted by LUCKPERMS and HYBRID. %s is the slot number.
      luckPermsPermissionTemplate: "omnipet.slot.unlocked.%s"

    # Price of each slot after `base`. A slot with no entry here cannot be bought.
    unlocks:
      "2":
        # Empty = anyone may buy it. A node here gates ELIGIBILITY only - it is never the price.
        permission: ""
        # Every listed currency is offered as a separate choice with its balance shown. OmniPet
        # never picks for the player. Remove a currency to stop accepting it.
        costs: { VAULT: 25000, PLAYER_POINTS: 50 }
      "3":
        permission: ""
        costs: { VAULT: 75000, PLAYER_POINTS: 125 }
      "4":
        permission: "omnipet.slot.purchase.4"
        costs: { VAULT: 175000, PLAYER_POINTS: 250 }
      "5":
        permission: "omnipet.slot.purchase.5"
        costs: { VAULT: 350000, PLAYER_POINTS: 500 }


# ----------------------------------------------------------------------------------------------
#  RUNTIME - the single task that moves every active pet
# ----------------------------------------------------------------------------------------------
#  RESTART ONLY. One bounded task updates all pets, visiting owners round-robin - there is no
#  task per pet, so pet count does not multiply scheduler load. Leave these alone unless you are
#  diagnosing tick time; the two `maximum` values are the throughput ceiling, not a target.
# ----------------------------------------------------------------------------------------------
runtime:
  initialDelayTicks: 1
  periodTicks: 1
  # Owners visited per tick. Lower this first if OmniPet costs measurable tick time.
  maximumOwnersPerTick: 64
  maximumPetsPerOwner: 10


# ----------------------------------------------------------------------------------------------
#  RENDER - how a pet looks while it moves
# ----------------------------------------------------------------------------------------------
#  RESTART ONLY. Shared by the built-in renderer and the ModelEngine adapter, so retuning here
#  applies to both. Strict like the runtime section and unlike the GUI one: these values steer
#  entities, so a misspelled key is refused rather than ignored. Delete the whole section for the
#  built-in tuning.
#
#  A pet's own movement shape - follow distance, orbit, hovering, bobbing - is per-pet and lives in
#  the pet definition's `behavior:` block, not here. This section is about the rendering.
# ----------------------------------------------------------------------------------------------
render:
  # How far a pet may drift from where it should be before it is teleported instead of steered.
  # Raise it and a lagging pet catches up visibly; lower it and it snaps more eagerly.
  safetyDistance: 8.0
  # Fraction of the remaining distance converted to velocity each tick. Higher is snappier and
  # twitchier; lower is smoother and lazier. Must stay in (0, 1].
  movementGain: 0.35
  # Hard ceiling on that velocity, in blocks per tick.
  maximumVelocity: 1.2
  # Client-side smoothing window. 0 disables it and the pet moves in visible steps.
  interpolationTicks: 3
  # How far a pet tips back at full speed, in degrees, like something leaning into a run.
  # 0 keeps it perfectly upright. Purely visual: the clickable hitbox stays where the pet is.
  maximumLeanDegrees: 12.0


# ----------------------------------------------------------------------------------------------
#  PROGRESSION - levelling, stamina, and the default EXP curve
# ----------------------------------------------------------------------------------------------
#  Server-wide fallback. Any pet definition may override the formula for itself.
# ----------------------------------------------------------------------------------------------
progression:
  maxLevel: 100
  maxStamina: 100.0
  staminaRegenPerSecond: 1.0

  # EXP needed for the next level. Variables: level, rarity, quality, evolution.
  # Compiled and test-evaluated at load: a formula that cannot compile, or that yields a value
  # that is not positive, is rejected at startup rather than at a player's next level-up.
  defaultExperienceFormula: "100 + level * 25 + evolution * 100"
  # The values the formula is checked against at load. Not gameplay - a startup smoke test.
  formulaSamples: { level: 1.0, rarity: 1.0, quality: 0.5, evolution: 0.0 }

  # Leftover EXP from a level-up: CARRY keeps it, DISCARD drops it.
  overflowPolicy: CARRY


# ----------------------------------------------------------------------------------------------
#  ITEMS - what an EXP candy and a breakthrough stone are made of
# ----------------------------------------------------------------------------------------------
#  Plain vanilla materials, so these work with no item plugin installed.
# ----------------------------------------------------------------------------------------------
items:
  experienceCandy:
    material: EXPERIENCE_BOTTLE
    experience: 100.0
  breakthroughStone:
    material: NETHER_STAR
    # Minimum level and evolution a pet needs before the stone will apply.
    requiredLevel: 10
    requiredEvolution: 0

  # ----------------------------------------------------------------------------------------------
  #  Appearance (optional)
  # ----------------------------------------------------------------------------------------------
  #  Every block below is optional and purely cosmetic. Delete any of them and the item looks exactly
  #  as it does now. A bad value warns and falls back for that key alone.
  #
  #  Keys, all optional:
  #    material        vanilla item id, e.g. DRAGON_EGG
  #    customModelData number your resource pack keys its model on
  #    glint           true adds the enchanted shimmer
  #    itemFlags       e.g. [HIDE_ATTRIBUTES, HIDE_ENCHANTS]
  #    lore            extra MiniMessage lines APPENDED after the built-in ones, so you cannot
  #                    accidentally delete the line telling the player how to use the item.
  #                    Max 12 lines, 256 characters each - a stored egg has a hard size limit.
  #
  #  Read when the item is CREATED. A reload restyles the next one; eggs already in an inventory or
  #  part-way through hatching keep the look they were made with, which is required - their payment
  #  record describes the item exactly as it was minted.
  #
  #  Names and descriptions are NOT here - those live in messages.yml under gui.egg.* and gui.item.*
  #
  #  egg:
  #    material: DRAGON_EGG
  #    customModelData: 1001
  #    glint: true
  #    lore:
  #      - "<dark_gray>Season 3 exclusive</dark_gray>"
  #  hatchReducer:
  #    material: CLOCK
  #  instantHatch:
  #    material: NETHER_STAR
  #  experienceCandy:
  #    appearance:
  #      customModelData: 2001


# ----------------------------------------------------------------------------------------------
#  GUI - menus, sounds, and on-screen feedback
# ----------------------------------------------------------------------------------------------
#  OPTIONAL SECTION. Delete the whole thing and OmniPet behaves exactly as it did before this
#  section existed - every value below is also its built-in default. Nothing here is fatal: an
#  unknown key is ignored with a warning, a bad value falls back.
# ----------------------------------------------------------------------------------------------
gui:

  # Sound and action-bar confirmation. Without this, every click feels the same - activating a
  # pet and failing to afford a slot are indistinguishable.
  feedback:
    # One master switch. false silences every sound and action bar plugin-wide - for servers
    # with their own sound design, and for players using a screen reader. Chat is unaffected.
    enabled: true
    # Minimum gap between two sounds from the same player, in milliseconds. This is what stops a
    # fast-clicking player becoming an audible nuisance to everyone nearby.
    minIntervalMillis: 150
    # Action-bar text alongside the sound. Only events worth narrating carry a line: summoning,
    # recalling, starting an incubation, claiming a hatch, and unlocking a slot. Repeatable actions
    # such as cycling the vault sort stay sound-only. Wording is in messages.yml under action-bar.*
    actionBar: true

    # A small burst shown to the acting player when something they waited for finally lands - a hatch
    # claimed, a slot unlocked, a pet summoned. Never for a repeatable click, and never visible to
    # anyone else: a burst other players could see would make a spammable menu a griefing tool.
    # Shares the interval below with the sound, so holding a click cannot make a fountain.
    particles: true
    # Any vanilla particle name. An unknown name costs the burst alone and warns; the sound stays.
    particleName: HAPPY_VILLAGER
    # Particles per burst, capped at 64.
    particleCount: 12

    # One cue per OUTCOME, not per event - so a new feature never needs new keys here.
    #   success  - it worked          failure  - it did not
    #   blocked  - not allowed        progress - acknowledged, still working
    # Cues play to the acting player only, never to bystanders. An unknown sound name warns at
    # load and silences that one cue; it never disables the others.
    success:  { sound: "ENTITY_EXPERIENCE_ORB_PICKUP", volume: 0.6, pitch: 1.2 }
    failure:  { sound: "BLOCK_NOTE_BLOCK_BASS",        volume: 0.6, pitch: 0.8 }
    blocked:  { sound: "BLOCK_CHEST_LOCKED",           volume: 0.6, pitch: 1.0 }
    progress: { sound: "UI_BUTTON_CLICK",              volume: 0.4, pitch: 1.0 }

  vault:
    # RESTART ONLY - the vault renderer reads this once, when it is built.
    # Capped at 45: the menu is 54 slots and the bottom row is paging and controls.
    petsPerPage: 45

  help:
    # Lines per /pet help page. Reloads live. Capped at 20.
    linesPerPage: 8

  studio:
    # RESTART ONLY. How long a Studio chat prompt waits for your reply before it expires.
    promptTimeoutSeconds: 120
    # Saving a pet in the Studio also writes eggs/<definitionId>_egg.yml, so the new pet is
    # immediately obtainable with /pet admin egg give. An existing egg is never overwritten, so
    # your hand-tuned durations and candidate pools are safe. Set false to stop the Studio
    # writing egg files at all. Reloads live.
    autoCreateEgg: true

  onboarding:
    # Two chat lines sent the FIRST time a player ever joins, telling them /pet exists. Without this
    # nothing announces the plugin: /pet tab-completes, but only for someone already looking for it.
    # Never repeats for a returning player. Set false if your server does its own introduction.
    # Wording lives in messages.yml under onboarding.*   Reloads live.
    firstJoinGreeting: true

  # Which language pack to read, as a file name in lang/. Ships with:
  #   en   built-in English (no file; this is the plugin's own text)
  #   vi   Tiếng Việt
  #
  # Bundled packs are copied into lang/ on first start and NEVER overwritten afterwards, so your
  # edits survive an upgrade. Add your own by dropping lang/<name>.yml beside them.
  #
  # Priority, highest first:  messages.yml  ->  lang/<locale>.yml  ->  built-in English.
  # So your messages.yml always wins, and a key missing from a pack falls back instead of breaking.
  # Naming a locale nobody has translated warns and uses English rather than refusing to start.
  # Reloads live.
  locale: en

  # ----------------------------------------------------------------------------------------------
  #  MENU RESTYLING (optional)
  # ----------------------------------------------------------------------------------------------
  #  Change what a menu is made of. Delete this and every menu looks exactly as it does now.
  #  Reloads live - reopen the menu to see a change.
  #
  #  Per menu:  size    slots, a multiple of 9 up to 54
  #             filler  the background pane material
  #             buttons per-button material and slot
  #
  #  Buttons are named, not numbered, so you can restyle "the hatch tile" without listing every
  #  state it can be in. Naming ONE material for a button that changes with state - the hatch tile
  #  is a different item when ready, incubating, and idle - pins it to that one look on purpose.
  #
  #  Menus and their buttons:
  #    hub                vault, hatch, slots, help, studio
  #    vault              previous, next, hub, sort, filter, status, unlockSlot   (materials only)
  #    hatch              startMain, startOff, incubation, hub, refresh,
  #                       redeemMain, redeemOff
  #    management         favorite, lock, moveUp, moveDown, candy, breakthrough, release,
  #                       refresh, back, hub
  #    slot               payVault, payPoints, confirm, cancel, hub
  #    adminTransactions  row, refresh, next
  #    adminReconcile     charge, noCharge, refund, sync, subject, back
  #
  #  redeemMain and redeemOff only appear while an egg is incubating - they sit in the slots the
  #  start buttons are not using. `row` styles every row of the admin transaction list at once.
  #
  #  The vault takes materials but not slots or size: pet rows fill slots 0-44 and the paging maths
  #  is built on that shape. Moving a button onto an occupied slot, or outside the menu, is refused
  #  with a warning naming the key - it keeps its normal slot rather than silently vanishing.
  #
  #  Item NAMES and LORE are not here; they are in messages.yml under gui.*
  #
  # menus:
  #   hub:
  #     filler: BLACK_STAINED_GLASS_PANE
  #     buttons:
  #       vault:  { material: CHEST, slot: 10 }
  #       hatch:  { material: TURTLE_EGG }
  #   management:
  #     size: 54
  #     buttons:
  #       release: { material: FIRE_CHARGE }
